<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="../../assets/images/logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Apple Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }

        .banner-image {
            transition: transform 10s ease;
        }

        .right-pane:hover .banner-image {
            transform: scale(1.05);
        }

        .glass-effect {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .input-focus-effect:focus {
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.15);
        }
    </style>
</head>

<body class="h-screen overflow-hidden">

    <div class="flex h-full w-full">

        <!-- LEFT PANE: FORGOT PASSWORD FORM -->
        <div class="flex-1 max-w-[500px] bg-white flex flex-col justify-center px-16 py-10 relative overflow-y-auto">

            <!-- Header -->
            <div class="mb-10">
                <i class="fab fa-apple text-[40px] text-gray-900 mb-5 block"></i>
                <h2 class="text-4xl font-bold text-gray-900 mb-3 tracking-tight">Reset Password</h2>
                <p class="text-gray-500 text-base">
                    Enter the email associated with your account and we'll send you a link to reset your password.
                </p>
            </div>

            <!-- Forgot Password Form -->
            <form id="forgot-password-form" onsubmit="event.preventDefault(); handleForgotPassword();">

                <!-- Error/Success Message -->
                <div id="message-container" class="hidden mb-5 p-4 rounded-xl text-sm items-center gap-2">
                    <i class="fas fa-info-circle"></i>
                    <span>Message here</span>
                </div>

                <!-- Email Input -->
                <div class="mb-6">
                    <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wide mb-2">
                        Email Address
                    </label>
                    <div class="relative">
                        <input type="email" id="email"
                            class="input-focus-effect w-full px-4 py-4 pl-12 bg-gray-50 border border-gray-200 rounded-xl text-base outline-none transition-all focus:bg-white focus:border-blue-600"
                            placeholder="name@example.com" required>
                        <i class="fas fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submit-btn"
                    class="w-full bg-gray-900 text-white py-4 rounded-xl font-semibold text-base transition-all hover:bg-gray-800 hover:-translate-y-0.5 active:scale-[0.98] mt-2 flex items-center justify-center gap-2">
                    <span id="btn-text">Send Reset Link</span>
                    <i class="fas fa-paper-plane text-xs"></i>
                </button>
            </form>

            <!-- Footer Links -->
            <div class="mt-8 text-center">
                <a href="login.html" class="text-sm text-blue-600 hover:underline"><i class="fas fa-arrow-left mr-1"></i> Back to Login</a>
            </div>

        </div>

        <!-- RIGHT PANE: PROMOTIONAL BANNER -->
        <div class="right-pane flex-[1.5] bg-black relative overflow-hidden hidden lg:flex items-center justify-center">

            <!-- Background Image -->
            <img src="../../assets/images/bannerlogin.png" alt="Apple Store Banner"
                class="banner-image absolute inset-0 w-full h-full object-cover opacity-80">

            <!-- Gradient Overlay -->
            <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent"></div>

            <!-- Content -->
            <div class="absolute bottom-16 left-16 right-16 text-white z-10">
                <h1 class="text-5xl font-bold leading-tight mb-4">
                    Secure Account Recovery.
                </h1>
                <p class="text-lg text-white/80 max-w-md leading-relaxed">
                    Regain access to your Apple Store account safely and securely.
                </p>
            </div>

            <!-- Decorative Element -->
            <div class="absolute top-10 right-10 w-32 h-32 bg-blue-500/20 rounded-full blur-3xl"></div>
            <div class="absolute bottom-20 left-20 w-40 h-40 bg-purple-500/20 rounded-full blur-3xl"></div>

        </div>

    </div>

    <script>
        async function handleForgotPassword() {
            const email = document.getElementById('email').value.trim();
            const btnText = document.getElementById('btn-text');
            const submitBtn = document.getElementById('submit-btn');

            btnText.innerText = "Sending...";
            submitBtn.disabled = true;
            hideMessage();

            try {
                // Ensure to point to the correct backend url (can be localhost or production)
                const apiUrl = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
                                ? 'http://localhost:3000/api/auth/forgot-password' 
                                : 'https://project3-icy1.onrender.com/api/auth/forgot-password';

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const result = await response.json();

                if (response.ok) {
                    showSuccess(result.message || 'If an account with that email exists, a password reset link has been sent.');
                    document.getElementById('email').value = '';
                } else {
                    showError(result.message || 'Failed to send reset link. Please try again.');
                }

            } catch (error) {
                showError('Network error. Please try again later.');
                console.error(error);
            } finally {
                btnText.innerText = "Send Reset Link";
                submitBtn.disabled = false;
            }
        }

        function showError(msg) {
            const messageDiv = document.getElementById('message-container');
            messageDiv.className = 'flex mb-5 p-4 rounded-xl text-sm items-center gap-2 bg-red-50 text-red-600 border border-red-200';
            messageDiv.querySelector('i').className = "fas fa-exclamation-circle";
            messageDiv.querySelector('span').innerText = msg;
        }

        function showSuccess(msg) {
            const messageDiv = document.getElementById('message-container');
            messageDiv.className = 'flex mb-5 p-4 rounded-xl text-sm items-center gap-2 bg-green-50 text-green-600 border border-green-200';
            messageDiv.querySelector('i').className = "fas fa-check-circle";
            messageDiv.querySelector('span').innerText = msg;
        }

        function hideMessage() {
            const messageDiv = document.getElementById('message-container');
            messageDiv.className = 'hidden mb-5 p-4 rounded-xl text-sm items-center gap-2';
        }
    </script>
    <script src="/assets/js/page-transitions.js" defer></script>
</body>

</html>
