<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="../../assets/images/logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Apple Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }

        .banner-image {
            transition: transform 10s ease;
        }

        .right-pane:hover .banner-image {
            transform: scale(1.05);
        }

        .glass-effect {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .input-focus-effect:focus {
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.15);
        }
    </style>
</head>

<body class="h-screen overflow-hidden">

    <div class="flex h-full w-full">

        <!-- LEFT PANE: RESET PASSWORD FORM -->
        <div class="flex-1 max-w-[500px] bg-white flex flex-col justify-center px-16 py-10 relative overflow-y-auto">

            <!-- Header -->
            <div class="mb-10">
                <i class="fab fa-apple text-[40px] text-gray-900 mb-5 block"></i>
                <h2 class="text-4xl font-bold text-gray-900 mb-3 tracking-tight">Create New Password</h2>
                <p class="text-gray-500 text-base">
                    Your new password must be different from previous used passwords.
                </p>
            </div>

            <!-- Reset Password Form -->
            <form id="reset-password-form" onsubmit="event.preventDefault(); handleResetPassword();">

                <!-- Error/Success Message -->
                <div id="message-container" class="hidden mb-5 p-4 rounded-xl text-sm items-center gap-2">
                    <i class="fas fa-info-circle"></i>
                    <span>Message here</span>
                </div>

                <!-- New Password Input -->
                <div class="mb-5">
                    <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wide mb-2">
                        New Password
                    </label>
                    <div class="relative">
                        <input type="password" id="new-password"
                            class="input-focus-effect w-full px-4 py-4 pl-12 bg-gray-50 border border-gray-200 rounded-xl text-base outline-none transition-all focus:bg-white focus:border-blue-600"
                            placeholder="••••••••" required>
                        <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <button type="button" onclick="togglePassword('new-password', 'password-icon-1')"
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                            <i id="password-icon-1" class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Confirm Password Input -->
                <div class="mb-6">
                    <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wide mb-2">
                        Confirm Password
                    </label>
                    <div class="relative">
                        <input type="password" id="confirm-password"
                            class="input-focus-effect w-full px-4 py-4 pl-12 bg-gray-50 border border-gray-200 rounded-xl text-base outline-none transition-all focus:bg-white focus:border-blue-600"
                            placeholder="••••••••" required>
                        <i class="fas fa-check-circle absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <button type="button" onclick="togglePassword('confirm-password', 'password-icon-2')"
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                            <i id="password-icon-2" class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submit-btn"
                    class="w-full bg-gray-900 text-white py-4 rounded-xl font-semibold text-base transition-all hover:bg-gray-800 hover:-translate-y-0.5 active:scale-[0.98] mt-2 flex items-center justify-center gap-2">
                    <span id="btn-text">Reset Password</span>
                    <i class="fas fa-check text-xs"></i>
                </button>
            </form>

            <!-- Footer Links -->
            <div class="mt-8 text-center" id="back-to-login" style="display: none;">
                <a href="login.html" class="inline-block bg-blue-600 text-white px-6 py-2 rounded-lg text-sm font-semibold hover:bg-blue-700 transition">
                    Go to Login
                </a>
            </div>

        </div>

        <!-- RIGHT PANE: PROMOTIONAL BANNER -->
        <div class="right-pane flex-[1.5] bg-black relative overflow-hidden hidden lg:flex items-center justify-center">

            <!-- Background Image -->
            <img src="../../assets/images/bannerlogin.png" alt="Apple Store Banner"
                class="banner-image absolute inset-0 w-full h-full object-cover opacity-80">

            <!-- Gradient Overlay -->
            <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent"></div>

            <!-- Content -->
            <div class="absolute bottom-16 left-16 right-16 text-white z-10">
                <h1 class="text-5xl font-bold leading-tight mb-4">
                    Welcome Back.
                </h1>
                <p class="text-lg text-white/80 max-w-md leading-relaxed">
                    Set a new password and continue enjoying your Apple experience.
                </p>
            </div>

            <!-- Decorative Element -->
            <div class="absolute top-10 right-10 w-32 h-32 bg-blue-500/20 rounded-full blur-3xl"></div>
            <div class="absolute bottom-20 left-20 w-40 h-40 bg-purple-500/20 rounded-full blur-3xl"></div>

        </div>

    </div>

    <script>
        function togglePassword(inputId, iconId) {
            const passwordInput = document.getElementById(inputId);
            const icon = document.getElementById(iconId);

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        async function handleResetPassword() {
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const btnText = document.getElementById('btn-text');
            const submitBtn = document.getElementById('submit-btn');

            if (newPassword !== confirmPassword) {
                showError("Passwords do not match.");
                return;
            }
            
            if (newPassword.length < 6) {
                showError("Password must be at least 6 characters long.");
                return;
            }

            // Get token from URL
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (!token) {
                showError("Invalid or missing reset token.");
                return;
            }

            btnText.innerText = "Resetting...";
            submitBtn.disabled = true;
            hideMessage();

            try {
                // Ensure to point to the correct backend url
                const apiUrl = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
                                ? 'http://localhost:3000/api/auth/reset-password' 
                                : 'https://project3-icy1.onrender.com/api/auth/reset-password';

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });

                const result = await response.json();

                if (response.ok) {
                    showSuccess(result.message || 'Password reset successful. You can now log in.');
                    document.getElementById('new-password').value = '';
                    document.getElementById('confirm-password').value = '';
                    submitBtn.style.display = 'none';
                    document.getElementById('back-to-login').style.display = 'block';
                } else {
                    showError(result.message || 'Failed to reset password. Token may be invalid or expired.');
                }

            } catch (error) {
                showError('Network error. Please try again later.');
                console.error(error);
            } finally {
                btnText.innerText = "Reset Password";
                submitBtn.disabled = false;
            }
        }

        function showError(msg) {
            const messageDiv = document.getElementById('message-container');
            messageDiv.className = 'flex mb-5 p-4 rounded-xl text-sm items-center gap-2 bg-red-50 text-red-600 border border-red-200';
            messageDiv.querySelector('i').className = "fas fa-exclamation-circle";
            messageDiv.querySelector('span').innerText = msg;
        }

        function showSuccess(msg) {
            const messageDiv = document.getElementById('message-container');
            messageDiv.className = 'flex mb-5 p-4 rounded-xl text-sm items-center gap-2 bg-green-50 text-green-600 border border-green-200';
            messageDiv.querySelector('i').className = "fas fa-check-circle";
            messageDiv.querySelector('span').innerText = msg;
        }

        function hideMessage() {
            const messageDiv = document.getElementById('message-container');
            messageDiv.className = 'hidden mb-5 p-4 rounded-xl text-sm items-center gap-2';
        }
        
        // Initial check for token
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (!urlParams.get('token')) {
                showError("No reset token provided. Please request a new password reset link.");
                document.getElementById('submit-btn').disabled = true;
            }
        });
    </script>
    <script src="/assets/js/page-transitions.js" defer></script>
</body>

</html>
